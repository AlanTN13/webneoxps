<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matriz de priorización</title>
  <desc id="desc">Portada editorial original de NexOps Insights.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#07111f"/><stop offset=".58" stop-color="#111b34"/><stop offset="1" stop-color="#25134d"/></linearGradient>
    <linearGradient id="photoWash" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#020617" stop-opacity=".15"/><stop offset=".55" stop-color="#020617" stop-opacity=".4"/><stop offset="1" stop-color="#020617" stop-opacity=".96"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#64748b" stroke-opacity=".12"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#020617" flood-opacity=".28"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/><rect width="1600" height="900" fill="url(#grid)" opacity=".35"/>
  <circle cx="1390" cy="110" r="230" fill="#f59e0b" opacity=".09" filter="url(#glow)"/>
  <path d="M80 72H138" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <text x="158" y="80" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="750" fill="#cbd5e1" letter-spacing=".18em">NEXOPS  /  INSIGHTS</text>
  <g><rect x="170" y="135" width="1260" height="610" rx="30" fill="#f8fafc" stroke="#cbd5e1" filter="url(#shadow)"/><text x="230" y="195" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#334155" letter-spacing=".12em">MATRIZ DE PRIORIZACIÓN</text>
        <path d="M330 650V260M330 650H1330" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><path d="M330 455H1330M830 260V650" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="12 10"/>
        <text x="790" y="705" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing=".12em">IMPACTO →</text><text x="230" y="470" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#64748b" text-anchor="middle" transform="rotate(-90 230 470)" letter-spacing=".12em">FACTIBILIDAD</text>
        <text x="1060" y="308" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#16a34a" text-anchor="middle" letter-spacing=".16em">PRIORIZAR</text><text x="560" y="615" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#94a3b8" text-anchor="middle" letter-spacing=".16em">POSTERGAR</text>
        <circle cx="1100" cy="350" r="72" fill="#22c55e"/><text x="1100" y="356" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">REPORTES</text><circle cx="955" cy="390" r="58" fill="#8b5cf6"/><text x="955" y="396" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">SEGUIMIENTO</text><circle cx="735" cy="520" r="48" fill="#38bdf8"/><text x="735" y="526" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">ALTAS</text><circle cx="520" cy="380" r="54" fill="#f43f5e"/><text x="520" y="386" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">EXCEPCIONES</text><circle cx="1210" cy="505" r="42" fill="#f59e0b"/><text x="1210" y="511" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">PEDIDOS</text></g>
  <path d="M80 828H1520" stroke="#94a3b8" stroke-opacity=".18"/>
  <text x="80" y="858" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" fill="#64748b" letter-spacing=".14em">EDITORIAL SYSTEM · LANDSCAPE 16:9</text>
