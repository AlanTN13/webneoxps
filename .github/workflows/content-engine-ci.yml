name: Content Engine CI

on:
  push:
    branches:
      - codex/content-engine-v1

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/content-engine-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Finalize Git-first runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          contract = Path('src/data/news/contract.js')
          text = contract.read_text()
          old = 'const modules = import.meta.glob("./*.json", { eager: true, import: "default" });'
          new = 'const modules = typeof import.meta.glob === "function"\n  ? import.meta.glob("./*.json", { eager: true, import: "default" })\n  : {};'
          if old in text:
              contract.write_text(text.replace(old, new))
          Path('src/env.d.ts').write_text('/// <reference types="vite/client" />\n')
          PY
          rm -rf .sanity schemaTypes src/lib/sanity src/sanity
          rm -f sanity.cli.ts sanity.config.ts
          npm install --package-lock-only --ignore-scripts
      - name: Install exact dependencies
        run: npm ci
      - name: Validate news contract
        run: npm run news:validate
      - name: Run news tests
        run: npm run news:test
      - name: Lint
        run: npm run lint
      - name: Build and generate SEO artifacts
        run: npm run build
      - name: Assert SEO output
        run: |
          test -f dist/noticias/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test "$(find dist/noticias -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 13
          grep -q 'application/ld+json' dist/noticias/gemini-3-supera-a-chatgpt-y-redefine-el-liderazgo-en-inteligencia-artificial/index.html
          grep -q '<urlset' dist/sitemap.xml
      - name: Commit validated runtime cleanup
        run: |
          git add -A package-lock.json src/data/news/contract.js src/env.d.ts .sanity schemaTypes src/lib/sanity src/sanity sanity.cli.ts sanity.config.ts
          if git diff --cached --quiet; then
            echo "Runtime already finalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: finalize Git-first news runtime"
          git push origin HEAD:codex/content-engine-v1
