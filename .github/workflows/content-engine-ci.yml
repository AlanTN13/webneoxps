name: Content Engine CI

on:
  push:
    branches:
      - codex/content-engine-v1

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/content-engine-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact dependencies
        run: npm ci
      - name: Validate news contract
        run: npm run news:validate
      - name: Run news tests
        run: npm run news:test
      - name: Lint
        run: npm run lint
      - name: Build and generate SEO artifacts
        run: npm run build
      - name: Assert SEO output
        run: |
          test -f dist/noticias/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test "$(find dist/noticias -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 13
          grep -q 'application/ld+json' dist/noticias/gemini-3-supera-a-chatgpt-y-redefine-el-liderazgo-en-inteligencia-artificial/index.html
      - name: Commit lockfile sync
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync lockfile for Git-first news runtime"
          git push origin HEAD:codex/content-engine-v1
