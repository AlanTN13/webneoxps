name: Radar V2 Canary 1

on:
  push:
    branches:
      - canary/radar-v2-publication-1

permissions:
  contents: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install exact dependencies
        run: npm ci
      - name: Generate deterministic production cover
        run: |
          python3 <<'PY'
          import binascii, hashlib, os, struct, zlib

          W, H = 1600, 900
          bg = (243, 241, 234)
          board = (252, 251, 247)
          line = (86, 88, 80)
          border = (204, 203, 195)
          notes = [(244,221,137),(207,224,181),(211,208,232),(239,198,177)]
          px = bytearray(bg * (W * H))

          def rect(x0,y0,x1,y1,c):
              x0=max(0,x0); y0=max(0,y0); x1=min(W,x1); y1=min(H,y1)
              for y in range(y0,y1):
                  row=(y*W+x0)*3
                  for _ in range(x0,x1):
                      px[row:row+3]=bytes(c); row+=3

          def stroke_rect(x0,y0,x1,y1,c,t=3):
              rect(x0,y0,x1,y0+t,c); rect(x0,y1-t,x1,y1,c)
              rect(x0,y0,x0+t,y1,c); rect(x1-t,y0,x1,y1,c)

          # board + three prioritization lanes
          rect(110,80,1490,820,board); stroke_rect(110,80,1490,820,border,5)
          lanes=[(170,175,545,735),(615,175,990,735),(1060,175,1435,735)]
          for i,(x0,y0,x1,y1) in enumerate(lanes):
              stroke_rect(x0,y0,x1,y1,border,3)
              rect(x0+25,y0+20,x1-25,y0+75,(226,225,216))
              positions=[(x0+40,y0+120),(x0+200,y0+220),(x0+55,y0+330),(x0+205,y0+440)]
              for j,(x,y) in enumerate(positions):
                  c=notes[(i+j)%len(notes)]
                  rect(x,y,x+135,y+88,c)
                  rect(x+20,y+30,x+92,y+36,line)
                  rect(x+20,y+48,x+108,y+54,line)
              rect(x0+45,y1-82,x1-45,y1-75,line)
          # directional arrow: compare -> prioritize -> choose
          rect(500,120,1085,128,line)
          for d in range(0,55):
              rect(1085+d,120-d//2,1092+d,128+d//2,line)

          raw = bytearray()
          stride=W*3
          for y in range(H):
              raw.append(0)
              raw.extend(px[y*stride:(y+1)*stride])

          def chunk(kind,data):
              return struct.pack('>I',len(data))+kind+data+struct.pack('>I',binascii.crc32(kind+data)&0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR',struct.pack('>IIBBBBB',W,H,8,2,0,0,0)) + chunk(b'IDAT',zlib.compress(bytes(raw),9)) + chunk(b'IEND',b'')
          tmp='/tmp/radar-cover.png'
          target='public/assets/insights/cover-priorizar-automatizaciones-pyme.png'
          open(tmp,'wb').write(png)
          if os.path.exists(target):
              if open(target,'rb').read()!=png:
                  raise SystemExit('idempotency mismatch: existing cover differs from deterministic output')
              print('CANARY COVER IDEMPOTENT', hashlib.sha256(png).hexdigest())
          else:
              open(target,'wb').write(png)
              print('CANARY COVER GENERATED', len(png), hashlib.sha256(png).hexdigest())
          PY
      - name: Materialize canary article atomically
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { detectAddAction } from './scripts/news-contract.mjs';
          import { readNewsFiles } from './scripts/news-validate.mjs';

          const candidatePath = 'docs/radar-v2/canary-1/candidate.json';
          const targetPath = 'src/data/news/que-procesos-automatizar-primero-pyme.json';
          const candidate = JSON.parse(await fs.readFile(candidatePath, 'utf8'));
          candidate.coverImage = '/assets/insights/cover-priorizar-automatizaciones-pyme.png';
          candidate.engineRunId = 'radar-v2-canary-1-2026-08-14';

          let existingTarget = null;
          try { existingTarget = JSON.parse(await fs.readFile(targetPath, 'utf8')); } catch (error) {
            if (error.code !== 'ENOENT') throw error;
          }

          if (!existingTarget) {
            const existing = await readNewsFiles();
            const result = detectAddAction(existing, candidate);
            if (result.action !== 'add') {
              console.error(result.errors || []);
              throw new Error('pre-add news-check conflict');
            }
            await fs.writeFile(targetPath, `${JSON.stringify(candidate, null, 2)}\n`);
            console.log(`CANARY ARTICLE ADD — ${targetPath}`);
          } else {
            for (const field of ['slug', 'topicFingerprint', 'engineRunId', 'coverImage']) {
              if (existingTarget[field] !== candidate[field]) throw new Error(`idempotency mismatch in ${field}`);
            }
            console.log('CANARY ARTICLE IDEMPOTENT — expected publication already present');
          }
          NODE
      - name: Validate cover quality
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='public/assets/insights/cover-priorizar-automatizaciones-pyme.png';
          const b=fs.readFileSync(p);
          const sig=[0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a];
          if (!sig.every((v,i)=>b[i]===v)) throw new Error('cover is not PNG');
          const width=b.readUInt32BE(16), height=b.readUInt32BE(20), ratio=width/height;
          if (b.length < 5_000 || b.length > 1_500_000) throw new Error(`cover byte size out of gate: ${b.length}`);
          if (width < 1200 || height < 675) throw new Error(`cover dimensions too small: ${width}x${height}`);
          if (ratio < 1.6 || ratio > 1.9) throw new Error(`cover aspect ratio out of gate: ${ratio}`);
          console.log(`CANARY COVER QUALITY OK — ${width}x${height}, ${b.length} bytes, ratio ${ratio.toFixed(3)}`);
          NODE
      - name: Post-add repository validation
        run: npm run news:validate
      - name: Content tests
        run: npm run news:test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Assert canary SEO output
        run: |
          test -f dist/noticias/que-procesos-automatizar-primero-pyme/index.html
          grep -q 'Qué procesos automatizar primero' dist/noticias/que-procesos-automatizar-primero-pyme/index.html
          grep -q 'cover-priorizar-automatizaciones-pyme.png' dist/noticias/que-procesos-automatizar-primero-pyme/index.html
      - name: Commit article and cover atomically when needed
        run: |
          if git diff --quiet -- src/data/news/que-procesos-automatizar-primero-pyme.json public/assets/insights/cover-priorizar-automatizaciones-pyme.png; then
            echo 'CANARY NOOP — publication already present'
            exit 0
          fi
          git config user.name 'NexOps Radar Canary'
          git config user.email 'actions@users.noreply.github.com'
          git add src/data/news/que-procesos-automatizar-primero-pyme.json public/assets/insights/cover-priorizar-automatizaciones-pyme.png
          git commit -m 'content: publish Radar canary 1'
          git push origin HEAD:canary/radar-v2-publication-1
