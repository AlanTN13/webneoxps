name: NexOps Engineering Dispatcher

on:
  issues:
    types:
      - opened

permissions:
  contents: read

jobs:
  codex:
    if: github.actor == 'AlanTN13'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: "Confirm that Codex executed successfully for this repository. Do not modify files."
