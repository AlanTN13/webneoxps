name: NexOps Engineering Dispatcher

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing Engineering Request issue number
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  engineering:
    if: >-
      github.actor == 'AlanTN13' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[ENG]'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
      BRANCH_NAME: codex/eng-${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}-${{ github.run_id }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create isolated Engineering branch
        run: git switch -c "$BRANCH_NAME"

      - name: Build trusted Engineering Request
        run: |
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body,url > "$RUNNER_TEMP/engineering-issue.json"
          {
            echo '# NexOps Engineering Request'
            echo
            jq -r '"Issue: \(.url)\n\nTitle: \(.title)\n\n## Request\n\n\(.body)"' "$RUNNER_TEMP/engineering-issue.json"
            cat <<'EOF'

## Execution contract

You are the NexOps Engineering Lead for this single request.
- Work only on the request above and the minimum repository context needed to deliver it.
- Do not broaden scope, redesign unrelated areas, or perform open-ended research.
- One agent/workstream by default.
- Do not push, merge, or create a PR yourself; the workflow owns Git operations.
- You may modify the workspace and run local commands/tests.
- If no code change is actually required, leave the repository unchanged and explain why in your final message.
- If a real blocker requires product/business judgment, leave the repository recoverable and report NEEDS_DIRECTOR.
- Prefer a complete usable result over speculative refactors.
EOF
          } > .codex-engineering-request.md

      - name: Run Codex Engineering Lead
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          prompt-file: .codex-engineering-request.md

      - name: Remove transient request
        if: always()
        run: rm -f .codex-engineering-request.md

      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate changed workspace
        if: steps.changes.outputs.changed == 'true'
        run: |
          git diff --check
          npm run news:test --if-present
          npm run lint --if-present
          npm run build --if-present

      - name: Commit and push Engineering result
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'nexops-engineering[bot]'
          git config user.email 'nexops-engineering[bot]@users.noreply.github.com'
          git add -A
          git -c core.hooksPath=/dev/null commit -m "engineering: resolve issue #$ISSUE_NUMBER"
          git push origin "HEAD:$BRANCH_NAME"

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          CODEX_FINAL: ${{ steps.codex.outputs.final-message }}
        run: |
          TITLE=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq '.title')
          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH_NAME" \
            --title "$TITLE" \
            --body "Automated NexOps Engineering delivery for #$ISSUE_NUMBER.\n\nCodex execution completed and repository validation passed.\n\nCloses #$ISSUE_NUMBER")
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "ENGINEERING_WORKING complete. PR: $PR_URL\n\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Report no-change completion
        if: steps.changes.outputs.changed == 'false'
        env:
          CODEX_FINAL: ${{ steps.codex.outputs.final-message }}
        run: |
          {
            echo 'Codex dispatcher executed successfully with no repository changes.'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo 'Codex final message:'
            printf '%s\n' "$CODEX_FINAL"
          } > "$RUNNER_TEMP/no-change-comment.md"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/no-change-comment.md"
