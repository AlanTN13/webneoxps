name: Content Engine legacy migration

on:
  push:
    branches:
      - codex/content-engine-v1

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/content-engine-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Export and transform published Sanity posts
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const query = `*[_type == "post" && !(_id in path("drafts.**"))] | order(coalesce(publishedAt, _createdAt) asc) {
            _id, _createdAt, title, "slug": slug.current, publishedAt, excerpt,
            "category": category->title, sourceName, sourceUrl,
            mainImage{alt, caption, asset->{url}},
            body[]{..., asset->{url}, children[]{...}, markDefs[]{...}}
          }`;
          const blockText = (block) => (block?.children || []).map((child) => child?.text || '').join('').trim();
          const portableToContent = (body = [], fallback) => {
            const out = [];
            for (const block of body) {
              if (block?._type === 'image' && block.asset?.url) {
                out.push({ type: 'image', src: block.asset.url, alt: block.alt || '', ...(block.caption ? { caption: block.caption } : {}) });
                continue;
              }
              if (block?._type !== 'block') continue;
              const value = blockText(block);
              if (!value) continue;
              if (block.listItem) {
                const ordered = block.listItem === 'number';
                const previous = out.at(-1);
                if (previous?.type === 'list' && previous.ordered === ordered) previous.items.push(value);
                else out.push({ type: 'list', ordered, items: [value] });
                continue;
              }
              if (block.style === 'h2' || block.style === 'h3') {
                out.push({ type: 'heading', level: Number(block.style.slice(1)), text: value });
                continue;
              }
              if (block.style === 'blockquote') {
                out.push({ type: 'quote', text: value });
                continue;
              }
              out.push({ type: 'paragraph', text: value });
            }
            return out.length ? out : [{ type: 'paragraph', text: fallback }];
          };
          const run = async () => {
            const url = `https://t7ofgkv4.api.sanity.io/v2026-08-13/data/query/production?query=${encodeURIComponent(query)}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Sanity HTTP ${response.status}`);
            const { result = [] } = await response.json();
            fs.mkdirSync('src/data/news', { recursive: true });
            for (const post of result) {
              const slug = post.slug || post._id;
              const title = String(post.title || '').trim();
              const excerpt = String(post.excerpt || `Análisis NexOps sobre ${title}.`).trim();
              let metaDescription = excerpt;
              if (metaDescription.length < 70) metaDescription = `${excerpt} ${title}`.trim();
              metaDescription = metaDescription.slice(0, 180);
              const article = {
                title,
                slug,
                contentType: 'actualidad',
                category: post.category || 'Actualidad',
                publishedAt: post.publishedAt || post._createdAt,
                excerpt,
                seoTitle: title.slice(0, 70),
                metaDescription,
                primaryKeyword: slug.replace(/-/g, ' ').slice(0, 120),
                searchIntent: 'informacional',
                ...(post.sourceName && post.sourceUrl ? { sourceName: post.sourceName, sourceUrl: post.sourceUrl } : {}),
                content: portableToContent(post.body, excerpt),
                ...(post.mainImage?.asset?.url ? { coverImage: post.mainImage.asset.url } : {}),
                legacySanityId: post._id,
                generatedByEngine: false
              };
              fs.writeFileSync(path.join('src/data/news', `${slug}.json`), `${JSON.stringify(article, null, 2)}\n`);
            }
            console.log(`Migrated ${result.length} published posts`);
          };
          run().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Validate migrated content
        run: |
          npm run news:validate
          npm run test:news
      - name: Commit migrated files
        run: |
          git add src/data/news/*.json
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: migrate legacy news into content files"
          git push origin HEAD:codex/content-engine-v1
