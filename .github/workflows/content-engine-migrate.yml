name: Content Engine legacy migration

on:
  push:
    branches:
      - codex/content-engine-v1

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/content-engine-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export and transform published Sanity posts
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const query = `*[_type == "post" && !(_id in path("drafts.**"))] | order(coalesce(publishedAt, _createdAt) asc) {
            _id, _createdAt, title, "slug": slug.current, publishedAt, excerpt,
            "category": category->title, sourceName, sourceUrl,
            mainImage{alt, caption, asset->{url}},
            body[]{..., asset->{url}, children[]{...}, markDefs[]{...}}
          }`;
          const normalize = (value = '') => String(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9\s-]/g, ' ').replace(/\s+/g, ' ').trim();
          const slugify = (value = '') => normalize(value).replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
          const inferTerritory = (post) => {
            const text = normalize(`${post.category || ''} ${post.title || ''} ${post.excerpt || ''}`);
            if (/seo|search|trafico web|analytics|datos|reporting|kpi|dashboard/.test(text)) return 'data-analytics';
            if (/whatsapp|crm|venta|comercial|publicitario/.test(text)) return 'crm-automatizacion-comercial';
            if (/agentes autonomos|automatizacion/.test(text)) return 'automatizacion-procesos';
            return 'ia-aplicada-empresas';
          };
          const sanitizeBody = (body = [], fallback) => {
            const blocks = body.map((block, index) => {
              if (block?._type === 'image') {
                if (!block.asset?.url) return null;
                return { _key: block._key || `image-${index}`, _type: 'image', src: block.asset.url, alt: block.alt || '', ...(block.caption ? { caption: block.caption } : {}) };
              }
              if (block?._type !== 'block') return null;
              return {
                _key: block._key || `block-${index}`,
                _type: 'block',
                style: block.style || 'normal',
                ...(block.listItem ? { listItem: block.listItem } : {}),
                ...(block.level ? { level: block.level } : {}),
                children: (block.children || []).map((child, childIndex) => ({
                  _key: child._key || `span-${index}-${childIndex}`,
                  _type: 'span', marks: child.marks || [], text: child.text || ''
                })),
                markDefs: (block.markDefs || []).filter((mark) => mark?._type === 'link' && mark.href).map((mark, markIndex) => ({
                  _key: mark._key || `link-${index}-${markIndex}`, _type: 'link', href: mark.href
                }))
              };
            }).filter(Boolean);
            return blocks.length ? blocks : [{ _key: 'legacy-fallback', _type: 'block', style: 'normal', children: [{ _key: 'legacy-fallback-span', _type: 'span', marks: [], text: fallback }], markDefs: [] }];
          };
          const run = async () => {
            const url = `https://t7ofgkv4.api.sanity.io/v2026-08-13/data/query/production?query=${encodeURIComponent(query)}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Sanity HTTP ${response.status}`);
            const { result = [] } = await response.json();
            fs.mkdirSync('src/data/news', { recursive: true });
            for (const post of result) {
              const slug = slugify(post.slug || post.title || post._id);
              const publishedAt = post.publishedAt || post._createdAt;
              const excerpt = String(post.excerpt || `Análisis NexOps sobre ${post.title}.`).trim();
              const article = {
                version: 1,
                slug,
                title: String(post.title || '').trim(),
                excerpt,
                publishedAt,
                contentType: 'actualidad',
                territory: inferTerritory(post),
                ...(post.category ? { category: post.category } : {}),
                primaryKeyword: slug.split('-').slice(0, 8).join(' '),
                searchIntent: 'informacional',
                seoTitle: String(post.title || '').trim().slice(0, 70),
                metaDescription: excerpt.slice(0, 180),
                canonicalUrl: `https://www.nexopstech.com/noticias/${slug}`,
                engineScore: null,
                topicFingerprint: `legacy:${slug}`,
                originId: `sanity:${post._id}`,
                generatedByEngine: false,
                generatedAt: publishedAt,
                sources: post.sourceUrl ? [{
                  name: post.sourceName || 'Fuente original',
                  url: String(post.sourceUrl).replace(/\/$/, ''),
                  type: /argentina\.gob\.ar|arxiv\.org|youtube\.com/.test(post.sourceUrl) ? 'primary' : 'secondary'
                }] : [],
                ...(post.mainImage?.asset?.url ? { mainImage: { src: post.mainImage.asset.url, alt: post.mainImage.alt || post.title } } : {}),
                body: sanitizeBody(post.body, excerpt)
              };
              fs.writeFileSync(path.join('src/data/news', `${slug}.json`), `${JSON.stringify(article, null, 2)}\n`);
            }
            console.log(`Migrated ${result.length} published posts`);
          };
          run().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Validate migrated content
        run: |
          npm run news:validate
          npm run test:news

      - name: Commit migrated files
        run: |
          if git diff --quiet -- src/data/news; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news/*.json
          git commit -m "chore: migrate legacy news into content files"
          git push origin HEAD:codex/content-engine-v1
