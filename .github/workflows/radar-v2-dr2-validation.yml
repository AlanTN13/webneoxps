name: Radar V2 DR2 Validation

on:
  push:
    branches:
      - test/radar-v2-dry-run-2

permissions:
  contents: read

jobs:
  dr2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install exact dependencies
        run: npm ci
      - name: Executable candidate news-check
        run: node scripts/news-check.mjs docs/radar-v2/dry-run-2/candidate.json
      - name: Build candidate with coverImage
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const candidate = JSON.parse(await fs.readFile('docs/radar-v2/dry-run-2/candidate.json', 'utf8'));
          candidate.coverImage = '/assets/insights/cover-priorizar-automatizaciones-pyme.jpg';
          await fs.writeFile('/tmp/radar-dr2-candidate-with-cover.json', JSON.stringify(candidate, null, 2));
          NODE
      - name: Executable news-check with coverImage
        run: node scripts/news-check.mjs /tmp/radar-dr2-candidate-with-cover.json
      - name: Validate real binary cover asset
        run: |
          COVER='public/assets/insights/cover-priorizar-automatizaciones-pyme.jpg'
          test -s "$COVER"
          file "$COVER"
          file "$COVER" | grep -q 'JPEG image data'
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'public/assets/insights/cover-priorizar-automatizaciones-pyme.jpg';
          const bytes = fs.readFileSync(path);
          if (bytes.length < 1024 || bytes[0] !== 0xff || bytes[1] !== 0xd8) {
            throw new Error('cover asset is not a non-trivial JPEG');
          }
          console.log(`DR2 COVER BINARY OK — ${bytes.length} bytes`);
          NODE
      - name: Validate repository news
        run: npm run news:validate
      - name: Run content tests
        run: npm run news:test
      - name: Lint
        run: npm run lint
      - name: Build and generate SEO artifacts
        run: npm run build
      - name: Assert build artifacts
        run: |
          test -f dist/noticias/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          SOURCE_COUNT="$(find src/data/news -maxdepth 1 -type f -name '*.json' | wc -l)"
          GENERATED_COUNT="$(find dist/noticias -mindepth 2 -maxdepth 2 -type f -name index.html | wc -l)"
          echo "News JSON: $SOURCE_COUNT"
          echo "Generated SEO pages: $GENERATED_COUNT"
          test "$GENERATED_COUNT" -eq "$SOURCE_COUNT"
